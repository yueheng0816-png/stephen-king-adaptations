name: Weekly Full Data Refresh

on:
  schedule:
    - cron: '23 5 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  full-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: 'file:./dev.db'

      - name: Run full data pipeline
        run: |
          npm run pipeline:adaptations
          npm run pipeline:ratings
          npm run pipeline:posters
          npm run pipeline:streaming
          npx tsx scripts/09-normalize-and-seed.ts
        env:
          DATABASE_URL: 'file:./dev.db'
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDb_API_KEY: ${{ secrets.OMDB_API_KEY }}

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add prisma/dev.db data/
          if git diff --staged --quiet; then
            echo "No changes detected."
          else
            git commit -m "chore: weekly data refresh [automated]"
            git push
          fi

      - name: Trigger Vercel deploy
        if: success()
        run: |
          if [ -n "${{ secrets.VERCEL_DEPLOY_HOOK }}" ]; then
            curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
          fi
